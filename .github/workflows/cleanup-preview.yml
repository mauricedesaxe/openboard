name: Clean up preview

on:
  pull_request:
    types: [closed]

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Delete the preview worker
        run: >-
          npx --yes wrangler@4.120.0 delete
          "openboard-pr-${{ github.event.pull_request.number }}"
          --force
          || echo "no preview worker to delete"
