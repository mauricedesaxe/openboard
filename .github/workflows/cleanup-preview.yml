name: Clean up preview

on:
  pull_request:
    types: [closed]

jobs:
  delete:
    if: github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify the pull request is still closed
        id: closed-pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            const closed = pull.state === "closed";
            core.setOutput("closed", String(closed));
            if (!closed) core.notice("Skipping stale preview cleanup event.");
      - name: Delete the preview worker
        if: steps.closed-pr.outputs.closed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          output=$(npx --yes wrangler@4.120.0 delete "openboard-pr-${{ github.event.pull_request.number }}" --force 2>&1)
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            echo "$output"
            exit 0
          fi
          if echo "$output" | grep -q "does not exist"; then
            echo "$output"
            echo "no preview worker to delete"
            exit 0
          fi
          echo "$output"
          exit $status
      - name: Delete the per-PR preview D1
        if: always() && steps.closed-pr.outputs.closed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          output=$(npx --yes wrangler@4.120.0 d1 delete "openboard-pr-${{ github.event.pull_request.number }}" --skip-confirmation 2>&1)
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            echo "$output"
            exit 0
          fi
          if echo "$output" | grep -Eqi "not found|does not exist|couldn't find"; then
            echo "$output"
            echo "no preview D1 to delete"
            exit 0
          fi
          echo "$output"
          exit $status
