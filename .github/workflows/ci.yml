name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  preview:
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Generate the preview config
        env:
          PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/write-preview-config.mjs
      - name: Generate the auth secret
        id: auth-secret
        run: echo "value=$(openssl rand -base64 48)" >> "$GITHUB_OUTPUT"
      - name: Apply migrations to the shared preview D1
        run: pnpm exec wrangler d1 migrations apply openboard-preview --remote --config wrangler.preview.jsonc
      - name: Deploy the preview worker
        run: pnpm exec wrangler deploy --config wrangler.preview.jsonc
      - name: Set the preview auth secret
        run: echo "$SECRET_VALUE" | pnpm exec wrangler secret put BETTER_AUTH_SECRET --config wrangler.preview.jsonc
        env:
          SECRET_VALUE: ${{ steps.auth-secret.outputs.value }}
      - name: Redeploy with the secret applied
        run: pnpm exec wrangler deploy --config wrangler.preview.jsonc
      - name: Verify the preview serves the app
        run: |
          URL=$(cat preview-url.txt)
          STATUS=$(curl -sS --max-time 60 -o /tmp/preview-body.html -w "%{http_code}" "$URL")
          test "$STATUS" = "200" || { echo "preview returned HTTP $STATUS"; exit 1; }
          grep -q 'id="root"' /tmp/preview-body.html || { echo "preview did not serve the SPA"; exit 1; }
          echo "Preview OK: $URL"
      - name: Post the preview URL on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = fs.readFileSync("preview-url.txt", "utf8").trim();
            const marker = "<!-- openboard-preview -->";
            const body = `${marker}\nPreview: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
