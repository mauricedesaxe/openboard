name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".opencode/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  production:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://openboard.sweet-mouse-22c9.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build production release
        env:
          VITE_APP_ENV: production
          VITE_APP_RELEASE: ${{ github.sha }}
          VITE_BETTERSTACK_BROWSER_TOKEN: ${{ secrets.PRODUCTION_BETTERSTACK_BROWSER_TOKEN }}
        run: pnpm build
      - name: Apply production migrations
        # Runs against the live production D1 before the new worker deploys, so
        # every migration must be backward-compatible (expand/backfill/contract).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.production.jsonc
      - name: Set the production auth secret
        env:
          BETTER_AUTH_SECRET: ${{ secrets.PRODUCTION_BETTER_AUTH_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "$BETTER_AUTH_SECRET" | pnpm exec wrangler secret put BETTER_AUTH_SECRET --config wrangler.production.jsonc
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.production.jsonc
      - name: Verify production serves the app and public API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          URL=https://openboard.sweet-mouse-22c9.workers.dev
          for attempt in 1 2 3 4 5; do
            STATUS=$(curl -sS --max-time 60 -o /tmp/production-body.html -w "%{http_code}" "$URL") || STATUS=000
            AUTH_STATUS=$(curl -sS --max-time 60 -o /tmp/production-auth.json -w "%{http_code}" "$URL/api/auth/get-session") || AUTH_STATUS=000
            if [ "$STATUS" = "200" ] && grep -q 'id="root"' /tmp/production-body.html \
              && [ "$AUTH_STATUS" = "200" ]; then
              EVENT_SLUG=$(pnpm exec wrangler d1 execute DB --remote --config wrangler.production.jsonc --json --command "SELECT events.slug FROM agenda_publications INNER JOIN events ON events.id = agenda_publications.event_id WHERE agenda_publications.finalized = 1 ORDER BY agenda_publications.created_at DESC LIMIT 1" | jq -r '.[0].results[0].slug // empty')
              if [ -z "$EVENT_SLUG" ]; then
                echo "Production has no published schedule; checking OpenAPI only."
              fi
              node scripts/smoke-public-api.mjs "$URL" "$EVENT_SLUG"
              echo "Production OK: $URL"
              exit 0
            fi
            echo "attempt $attempt of 5: HTTP $STATUS, auth $AUTH_STATUS"
            sleep 10
          done
          echo "production did not serve the SPA or boot auth"
          cat /tmp/production-auth.json 2>/dev/null
          exit 1

  preview:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build preview release
        env:
          VITE_APP_ENV: preview
          VITE_APP_RELEASE: ${{ github.event.pull_request.head.sha }}
          VITE_BETTERSTACK_BROWSER_TOKEN: ${{ secrets.PREVIEW_BETTERSTACK_BROWSER_TOKEN }}
        run: pnpm build
      - name: Verify this is the current open pull request head
        id: current-pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            const eventHead = context.payload.pull_request.head.sha;
            const current = pull.state === "open" && pull.head.sha === eventHead;
            core.setOutput("current", String(current));
            if (!current) core.notice("Skipping stale preview event.");
      - name: Create or reuse the per-head preview D1
        id: preview-d1
        if: steps.current-pr.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_NAME: openboard-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
        run: |
          db_id=$(pnpm exec wrangler d1 list --json | jq -r --arg name "$DB_NAME" '.[] | select(.name == $name) | .uuid' | head -n1)
          if [ -z "$db_id" ]; then
            create_output=$(pnpm exec wrangler d1 create "$DB_NAME" 2>&1)
            echo "$create_output"
            db_id=$(echo "$create_output" | grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -n1 || true)
          fi
          if [ -z "$db_id" ]; then
            echo "Could not create or find the preview D1 $DB_NAME"
            exit 1
          fi
          echo "id=$db_id" >> "$GITHUB_OUTPUT"
      - name: Generate the preview config
        if: steps.current-pr.outputs.current == 'true'
        env:
          PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_D1_ID: ${{ steps.preview-d1.outputs.id }}
          PREVIEW_D1_NAME: openboard-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
        run: node scripts/write-preview-config.mjs
      - name: Generate the auth secret
        id: auth-secret
        if: steps.current-pr.outputs.current == 'true'
        run: echo "value=$(openssl rand -base64 48)" >> "$GITHUB_OUTPUT"
      - name: Recheck the pull request before resource updates
        id: current-pr-resources
        if: steps.current-pr.outputs.current == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            core.setOutput(
              "current",
              String(
                pull.state === "open" &&
                  pull.head.sha === context.payload.pull_request.head.sha,
              ),
            );
      - name: Apply migrations to the per-PR preview D1
        if: steps.current-pr-resources.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.preview.jsonc
      - name: Seed the deployed schedule smoke check
        if: steps.current-pr-resources.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 execute DB --remote --config wrangler.preview.jsonc --command "
            INSERT OR IGNORE INTO user (id, name, email, email_verified, created_at, updated_at)
              VALUES ('preview-user', 'Preview user', 'preview@example.com', 1, 0, 0);
            INSERT OR IGNORE INTO events (id, owner_user_id, name, slug, starts_on, ends_on, timezone, revision, created_at, updated_at)
              VALUES ('preview-event', 'preview-user', 'Preview conference', 'preview-schedule', '2028-08-13', '2028-08-13', 'UTC', 1, 0, 0);
            INSERT OR IGNORE INTO agendas (id, event_id, created_at, updated_at, revision)
              VALUES ('preview-agenda', 'preview-event', 0, 0, 0);
            INSERT OR IGNORE INTO agenda_items (id, agenda_id, event_id, kind, service_scope, service_title, starts_at_local, ends_at_local, placed, revision, created_at, updated_at)
              VALUES ('preview-item', 'preview-agenda', 'preview-event', 'service', 'event', 'Preview schedule check', '2028-08-13T09:00', '2028-08-13T10:00', 1, 1, 0, 0);
            INSERT INTO agenda_publications (id, agenda_id, event_id, revision, working_revision, event_name, timezone, starts_on, ends_on, published_by_user_id, created_at, finalized, requires_finalization)
              SELECT 'preview-publication', 'preview-agenda', 'preview-event', 1, 1, 'Preview conference', 'UTC', '2028-08-13', '2028-08-13', 'preview-user', 0, 0, 0
              WHERE NOT EXISTS (SELECT 1 FROM agenda_publications WHERE id = 'preview-publication');
            INSERT INTO published_agenda_items (id, publication_id, agenda_item_id, kind, title, starts_at, ends_at, canceled)
              SELECT 'preview-published-item', 'preview-publication', 'preview-item', 'service', 'Preview schedule check', '2028-08-13T09:00:00.000Z', '2028-08-13T10:00:00.000Z', 0
              WHERE NOT EXISTS (SELECT 1 FROM published_agenda_items WHERE id = 'preview-published-item');
            UPDATE agenda_publications SET finalized = 1
              WHERE id = 'preview-publication' AND finalized = 0;
          "
      - name: Set the preview auth secret
        if: steps.current-pr-resources.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ steps.auth-secret.outputs.value }}
        run: echo "$SECRET_VALUE" | pnpm exec wrangler secret put BETTER_AUTH_SECRET --config wrangler.preview.jsonc
      - name: Recheck the pull request before deploy
        id: current-pr-deploy
        if: steps.current-pr-resources.outputs.current == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            core.setOutput(
              "current",
              String(
                pull.state === "open" &&
                pull.head.sha === context.payload.pull_request.head.sha,
              ),
            );
      - name: Deploy the preview worker
        if: steps.current-pr-deploy.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.preview.jsonc
      - name: Verify the preview serves the app and boots auth
        if: steps.current-pr-deploy.outputs.current == 'true'
        run: |
          URL=$(cat preview-url.txt)
          for attempt in {1..12}; do
            STATUS=$(curl -sS --max-time 60 -o /tmp/preview-body.html -w "%{http_code}" "$URL") || STATUS=000
            AUTH_STATUS=$(curl -sS --max-time 60 -o /tmp/auth-session.json -w "%{http_code}" "$URL/api/auth/get-session") || AUTH_STATUS=000
            if [ "$STATUS" = "200" ] && grep -q 'id="root"' /tmp/preview-body.html \
              && [ "$AUTH_STATUS" = "200" ]; then
              echo "Preview OK: $URL"
              exit 0
            fi
            echo "attempt $attempt of 12: HTTP $STATUS, auth $AUTH_STATUS"
            sleep 10
          done
          echo "preview did not serve the SPA or boot auth"
          cat /tmp/auth-session.json 2>/dev/null
          exit 1
      - name: Compare deployed public schedule outputs
        if: steps.current-pr-deploy.outputs.current == 'true'
        run: |
          PREVIEW_URL=$(cat preview-url.txt) pnpm exec playwright test --config playwright.preview.config.ts
      - name: Post the preview URL on the PR
        if: steps.current-pr-deploy.outputs.current == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const url = fs.readFileSync("preview-url.txt", "utf8").trim();
            const marker = "<!-- openboard-preview -->";
            const body = `${marker}\nPreview: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
